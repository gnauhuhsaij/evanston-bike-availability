name: Deploy

# Push to main: test -> build an ARM image tagged with the commit -> push to ECR ->
# run deploy/deploy.sh on the EC2 server through Systems Manager (health + prediction
# checks, automatic rollback). Manual run with an image tag: redeploy that existing image
# (rollback to any earlier commit) without building.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (full commit SHA) to redeploy. Leave empty to build and deploy the selected branch."
        required: false
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # lets the run request GitHub's signed token for the keyless AWS login
  contents: read

jobs:
  test:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      REQUESTED_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose the image tag
        id: tag
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_SHA}"
          if ! [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full 40-character commit SHA"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED_TAG" ]; then echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to AWS (keyless, via GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Set up ARM build (the server is a t4g / Graviton instance)
        if: steps.tag.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.build == 'true'

      - name: Build and push the image
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          provenance: false

      - name: Check the requested image exists
        if: steps.tag.outputs.build == 'false'
        run: aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ steps.tag.outputs.tag }}" >/dev/null

      - name: Deploy on the server and verify (rolls back automatically on failure)
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          jq -n --arg image "$IMAGE" --arg registry "$REGISTRY" --arg region "$AWS_REGION" '{
            commands: [
              "set -euo pipefail",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              ("docker pull " + $image),
              ("docker run --rm --entrypoint cat " + $image + " /app/deploy/deploy.sh > /srv/dockside/deploy.sh"),
              ("bash /srv/dockside/deploy.sh " + $image)
            ],
            executionTimeout: ["900"]
          }' > params.json
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for i in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          err=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                --query StandardErrorContent --output text)
          [ -n "$err" ] && [ "$err" != "None" ] && echo "--- stderr ---" && echo "$err"
          echo "Final status: $status"
          [ "$status" = "Success" ]
