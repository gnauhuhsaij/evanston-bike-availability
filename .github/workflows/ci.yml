name: Test and package
on:
  push:
    branches-ignore: [main]   # main is tested by deploy.yml before deploying
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: docker build -t divvy-arrival-risk:ci .
